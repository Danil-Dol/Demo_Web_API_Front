<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Demo Front + .NET Web API</title>
    <link type="text/css" rel="stylesheet" href="css/materialize.min.css"/>
    <link type="text/css" rel="stylesheet" href="css/site.css"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"/>
</head>
<body>
    
<div class="container" id="games-container">
</div> 
    

<div class="flex-container" style="
                                   display: flex;
                                   gap: 1rem;
                                   align-items: center;
                                   flex-wrap: nowrap;
                                   padding: 1rem;
                                   background: #f5f5f5;
                                   border-radius: 8px;
                               ">
    <div class="container">
        <div class="card" style="border-radius:15px; border:1px solid #e0e0e0;">
            <div class="card-content">
                <span class="card-title" style="font-size: 2.8rem; line-height: 1.1; margin-bottom: 1.2rem; display: block; text-align: center; width: 100%; ">
                    Добавить новую игру
                </span>

                <form class="game-form">
                    <!-- Название -->
                    <div class="input-field">
                        <input id="game-add-title" type="text" class="validate" required>
                        <label for="title">Название игры</label>
                    </div>

                    <!-- Описание -->
                    <div class="input-field">
                        <textarea id="game-add-description" class="materialize-textarea" data-length="200"></textarea>
                        <label for="description">Описание</label>
                    </div>

                    <!-- Жанр -->
                    <div class="input-field">
                        <select id="genre-add-selector" class="browser-default deep-purple-text text-darken-3">
                            <option value="" disabled selected>Выберите жанр</option>
                        </select>
                    </div>

                    <!-- Мета-блок -->
                    <div class="meta-container">
                        <!-- Дата выхода -->
                        <div class="input-field input-meta-item">
                            <input id="game-add-release_date" type="date" class="validate">
                            <label for="release_date" class="active">Дата выхода</label>
                        </div>

                        <!-- Рейтинг -->
                        <div class="input-field input-meta-item">
                            <input id="game-add-rating" type="number" min="0" max="100" class="validate">
                            <label for="rating">Рейтинг</label>
                        </div>

                        <!-- Цена -->
                        <div class="input-field input-meta-item price">
                            <input id="game-add-price" type="number" class="validate right-align">
                            <label for="price">Цена</label>
                        </div>
                    </div>

                    <!-- Кнопки -->
                    <div class="card-action center-align" style="border-top:1px solid #eee; padding-top:1.5rem;">
                        <button class="waves-effect waves-light btn green" type="button" onclick="addGame()">
                            <i class="material-icons left">save</i>Добавить
                        </button>
                        <button class="waves-effect waves-light btn grey" type="reset">
                            <i class="material-icons left">clear</i>Отменить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <div class="container">
        <div class="card" style="border-radius:15px; border:1px solid #e0e0e0;">
            <div class="card-content">
                <span class="card-title" style="font-size: 2.8rem; line-height: 1.1; margin-bottom: 1.2rem; display: block; text-align: center; width: 100%; ">
                    Изменить игру
                </span>

                <form id="update-form" class="game-form" onsubmit="event.preventDefault(); updateGame();">>
                    <!-- Название -->
                    <div class="input-field">
                        <input id="title" type="text" class="validate" required>
                        <label for="title">Название игры</label>
                    </div>

                    <!-- Описание -->
                    <div class="input-field">
                        <textarea id="description" class="materialize-textarea" data-length="200"></textarea>
                        <label for="description">Описание</label>
                    </div>

                    <!-- Жанр -->
                    <div class="input-field">
                        <select id="genre-update-selector" class="browser-default deep-purple-text text-darken-3">
                            <option value="" disabled selected>Выберите жанр</option>
                        </select>
                    </div>

                    <!-- Мета-блок -->
                    <div class="meta-container">
                        <!-- Дата выхода -->
                        <div class="input-field input-meta-item">
                            <input id="release_date" type="date" class="validate">
                            <label for="release_date" class="active">Дата выхода</label>
                        </div>

                        <!-- Рейтинг -->
                        <div class="input-field input-meta-item">
                            <input id="rating" type="number" min="0" max="100" class="validate">
                            <label for="rating">Рейтинг</label>
                        </div>

                        <!-- Цена -->
                        <div class="input-field input-meta-item price">
                            <input id="price" type="number" class="validate right-align">
                            <label for="price">Цена (₽)</label>
                        </div>
                    </div>

                    <!-- Кнопки -->
                    <div class="card-action center-align" style="border-top:1px solid #eee; padding-top:1.5rem;">
                        <button class="waves-effect waves-light btn green" type="submit">
                            <i class="material-icons left">save</i>Сохранить
                        </button>
                        <button class="waves-effect waves-light btn grey" type="reset">
                            <i class="material-icons left">clear</i>Отменить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>


    <script type="text/javascript" src="js/materialize.min.js"></script>
    <script type="text/javascript" src="js/site.js"></script>
    <script type="text/javascript">
        getGames();
        getGenres();
    </script>
</body>
</html>
